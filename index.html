<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Dork Finder - Exposure Self-Check</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#17201d;--mut:#5b6761;--line:#d9dfdb;--acc:#0b6e5c;--accfg:#fff;--crit:#a3123a;--high:#b4470a;--med:#8a6d00;--low:#2c6aa0;--info:#5b6761}
@media(prefers-color-scheme:dark){:root{--bg:#101614;--card:#18211e;--ink:#e6ece9;--mut:#9aa8a1;--line:#2c3834;--acc:#4cc2a8;--accfg:#06241d;--crit:#ff7a9c;--high:#ffa066;--med:#e8c34a;--low:#7db8ee;--info:#9aa8a1}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;margin:.2em 0 .3em;letter-spacing:-.02em}
h2{font-size:1.15rem;margin:1.6em 0 .6em}
p{margin:.4em 0;max-width:68ch}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:.9rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input[type=text],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row>*{flex:1 1 140px}
.warn{border-left:4px solid var(--high);background:var(--card);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.err{color:var(--crit);font-size:.9rem;min-height:1.3em}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sum b{display:block;font-size:1.4rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.card.done{opacity:.8}
.q{font:.85rem/1.4 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;word-break:break-all;margin:8px 0}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1.5px solid currentColor;margin-right:6px}
.Critical{color:var(--crit)}.High{color:var(--high)}.Medium{color:var(--med)}.Low{color:var(--low)}.Info{color:var(--info)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
details{margin-top:8px}summary{cursor:pointer;color:var(--acc);font-weight:600}
.cat{display:flex;gap:6px;flex-wrap:wrap}
.cat button[aria-pressed=true]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
footer{margin-top:40px;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<main>
<div class="top"><span class="mut">Exposure self-check</span><button id="lang" type="button" aria-label="Language">EN / BM</button></div>
<h1>Dork Finder</h1>
<p data-i="intro"></p>
<p class="warn" data-i="warn"></p>

<h2 data-i="h_target"></h2>
<label for="dom" class="mut" data-i="dom"></label>
<input id="dom" type="text" inputmode="url" autocomplete="off" placeholder="example.com">
<div class="row">
  <select id="eng" aria-label="Search engine"><option value="g">Google</option><option value="b">Bing</option><option value="d">DuckDuckGo</option></select>
</div>
<label class="mut"><input type="checkbox" id="auth"> <span data-i="auth"></span></label>
<div class="err" id="err" role="alert"></div>
<button class="p" id="go" type="button" data-i="gen"></button>

<section id="out" hidden>
  <h2 data-i="h_sum"></h2>
  <div class="sum" id="sum"></div>
  <div class="row"><button id="exp" type="button" class="p" data-i="exp"></button><button id="reset" type="button" data-i="reset"></button><button id="imp" type="button" data-i="imp"></button><input id="impf" type="file" accept=".json,application/json" hidden></div>
  <h2 data-i="h_list"></h2>
  <div class="cat" id="cats"></div>
  <div id="list"></div>
  <h2 data-i="h_custom"></h2>
  <div class="row"><input id="cq" type="text" placeholder='intitle:"admin" {d}' aria-label="Custom dork"><button id="cadd" type="button" data-i="add"></button></div>
  <p class="mut" data-i="chint"></p>
</section>

<footer data-i="foot"></footer>
</main>

<script>
(function(){
"use strict";
var T={
ms:{intro:"Alat semakan pendedahan untuk domain anda sendiri. Ia membina query carian awam (dork) untuk mencari fail terdedah, direktori terbuka, panel log masuk dan kebocoran lain, kemudian menunjukkan risiko, kategori OWASP dan cara membaikinya.",
warn:"Guna hanya ke atas domain milik anda atau yang anda ada kebenaran bertulis untuk diuji. Akses tanpa kebenaran adalah kesalahan di bawah Akta Jenayah Komputer 1997. Alat ini hanya membina query; ia tidak mengimbas sistem.",
h_target:"Sasaran",dom:"Domain anda",auth:"Saya memiliki domain ini atau ada kebenaran bertulis.",gen:"Jana dork",
h_sum:"Ringkasan",imp:"Import hasil pengimbas (.json)",impe:"Fail JSON tidak sah.",impd:"Domain dalam fail tidak sepadan dengan sasaran.",exp:"Eksport laporan (.md)",reset:"Set semula",h_list:"Senarai dork",h_custom:"Dork tersuai",add:"Tambah",
chint:"Guna {d} sebagai tempat domain. Disimpan dalam pelayar anda sahaja.",
all:"Semua",copy:"Salin",open:"Buka",copied:"Disalin",risk:"Risiko",why:"Kenapa penting & cara baiki",fix:"Pembaikan",status:"Status",note:"Nota",
s0:"Belum disemak",s1:"Selamat",s2:"Terdedah",tot:"Jumlah",chk:"Disemak",exposed:"Terdedah",score:"Skor risiko",
eDom:"Domain tidak sah. Contoh: example.com",eAuth:"Sila sahkan anda ada kebenaran.",eC:"Dork mesti mengandungi {d} dan tidak lebih 200 aksara.",
foot:"Projek Tahun Akhir - Keselamatan Siber. Tiada data dihantar ke mana-mana pelayan; semua diproses dalam pelayar anda."},
en:{intro:"An exposure self-check for your own domain. It builds public search queries (dorks) that look for exposed files, open directories, login panels and other leaks, then shows the risk, OWASP category and how to fix each one.",
warn:"Use only on domains you own or have written permission to test. Unauthorised access is an offence under Malaysia's Computer Crimes Act 1997. This tool only builds queries; it does not scan any system.",
h_target:"Target",dom:"Your domain",auth:"I own this domain or have written permission.",gen:"Generate dorks",
h_sum:"Summary",imp:"Import scanner results (.json)",impe:"Invalid JSON file.",impd:"Domain in the file does not match the target.",exp:"Export report (.md)",reset:"Reset",h_list:"Dork library",h_custom:"Custom dorks",add:"Add",
chint:"Use {d} where the domain goes. Saved in your browser only.",
all:"All",copy:"Copy",open:"Open",copied:"Copied",risk:"Risk",why:"Why it matters and how to fix",fix:"Fix",status:"Status",note:"Notes",
s0:"Not checked",s1:"Clean",s2:"Exposed",tot:"Total",chk:"Checked",exposed:"Exposed",score:"Risk score",
eDom:"Invalid domain. Example: example.com",eAuth:"Please confirm you have permission.",eC:"Dork must contain {d} and be under 200 characters.",
foot:"Final Year Project, Cybersecurity. No data is sent to any server; everything runs in your browser."}
};
// id, category, risk, OWASP 2021, query, [desc en, desc ms], [fix en, fix ms]
var D=[
["env","Files","Critical","A05",'site:{d} ext:env OR ext:ini OR ext:conf OR ext:cfg',["Configuration files that may hold keys, passwords or database settings.","Fail konfigurasi yang mungkin mengandungi kunci, kata laluan atau tetapan pangkalan data."],["Move config outside the web root, block these extensions in the server, and rotate any exposed secrets.","Alihkan config keluar dari web root, sekat sambungan ini pada pelayan, dan tukar rahsia yang terdedah."]],
["sql","Files","Critical","A05",'site:{d} ext:sql OR ext:db OR ext:dump',["Database dumps can expose all user data.","Dump pangkalan data boleh mendedahkan semua data pengguna."],["Delete dumps from public folders, store backups offline or encrypted, restrict access.","Padam dump dari folder awam, simpan sandaran luar talian atau disulitkan, hadkan akses."]],
["bak","Files","High","A05",'site:{d} ext:bak OR ext:old OR ext:backup OR ext:zip OR ext:tar',["Old backups can leak source code and credentials.","Sandaran lama boleh membocorkan kod sumber dan kelayakan."],["Remove backup files from the web server and use a separate backup location.","Buang fail sandaran dari pelayan web dan guna lokasi sandaran berasingan."]],
["git","Files","High","A05",'site:{d} inurl:".git"',["An exposed .git folder can reveal full source code history.","Folder .git yang terdedah boleh mendedahkan sejarah kod sumber penuh."],["Block /.git in the server config and never deploy the repo folder itself.","Sekat /.git dalam config pelayan dan jangan deploy folder repo itu sendiri."]],
["log","Files","Medium","A05",'site:{d} ext:log',["Log files can contain usernames, IPs, tokens and internal paths.","Fail log boleh mengandungi nama pengguna, IP, token dan laluan dalaman."],["Store logs outside the web root and disable public access.","Simpan log di luar web root dan matikan akses awam."]],
["docs","Files","Medium","A01",'site:{d} (ext:pdf OR ext:docx OR ext:xlsx) (confidential OR internal OR password)',["Internal documents indexed by search engines.","Dokumen dalaman yang diindeks enjin carian."],["Remove or protect the files, add authentication, and request removal from search results.","Buang atau lindungi fail, tambah pengesahan, dan mohon pembuangan dari hasil carian."]],
["dir","Exposure","Medium","A05",'site:{d} intitle:"index of"',["Open directory listing shows every file in a folder.","Senarai direktori terbuka menunjukkan setiap fail dalam folder."],["Disable directory listing (Options -Indexes in Apache, autoindex off in Nginx).","Matikan senarai direktori (Options -Indexes pada Apache, autoindex off pada Nginx)."]],
["php","Exposure","Medium","A05",'site:{d} ext:php intitle:phpinfo',["phpinfo pages reveal server versions, paths and settings.","Halaman phpinfo mendedahkan versi pelayan, laluan dan tetapan."],["Delete phpinfo files from production.","Padam fail phpinfo dari produksi."]],
["err","Exposure","Medium","A05",'site:{d} ("sql syntax" OR "stack trace" OR "Warning: mysqli" OR "Fatal error")',["Verbose errors leak code paths and database details, and can hint at SQL injection.","Ralat terperinci membocorkan laluan kod dan butiran pangkalan data, dan boleh membayangkan SQL injection."],["Turn off debug output in production and show generic error pages.","Matikan output debug dalam produksi dan papar halaman ralat umum."]],
["sub","Exposure","Info","A05",'site:*.{d} -www',["Lists indexed subdomains to map your attack surface.","Senarai subdomain yang diindeks untuk memetakan permukaan serangan anda."],["Decommission unused subdomains and fix dangling DNS records.","Hentikan subdomain tidak digunakan dan baiki rekod DNS yang tergantung."]],
["login","Access","Low","A07",'site:{d} (inurl:login OR inurl:admin OR inurl:wp-admin OR inurl:signin)',["Finds login and admin panels that attackers target for brute force.","Mencari panel log masuk dan admin yang menjadi sasaran brute force."],["Enable MFA, rate limiting, and restrict admin pages by IP or VPN.","Aktifkan MFA, had kadar, dan hadkan halaman admin mengikut IP atau VPN."]],
["paste","Leaks","Medium","A02",'site:pastebin.com "{d}"',["Paste sites sometimes hold leaked credentials or data mentioning your domain.","Laman paste kadangkala mengandungi kelayakan atau data bocor yang menyebut domain anda."],["Reset affected passwords, report the paste for removal, and monitor with breach alerts.","Tetapkan semula kata laluan terjejas, laporkan paste untuk dibuang, dan pantau dengan amaran kebocoran."]],
["code","Leaks","High","A02",'site:github.com "{d}" (password OR secret OR api_key)',["Public repos may contain hard-coded secrets tied to your domain.","Repo awam mungkin mengandungi rahsia yang ditanam dalam kod berkaitan domain anda."],["Remove secrets from history, rotate keys, and enable GitHub secret scanning.","Buang rahsia dari sejarah, tukar kunci, dan aktifkan secret scanning GitHub."]],
["s3","Leaks","High","A01",'site:s3.amazonaws.com "{d}"',["Public cloud storage buckets named after your organisation.","Baldi storan awan awam yang dinamakan sempena organisasi anda."],["Block public access on buckets and review bucket policies.","Sekat akses awam pada baldi dan semak dasar baldi."]],
["key","Files","Critical","A02",'site:{d} (ext:pem OR ext:key OR ext:ppk OR "BEGIN RSA PRIVATE KEY")',["Private keys exposed on the web let attackers impersonate your servers or log in.","Kunci peribadi yang terdedah membolehkan penyerang menyamar pelayan anda atau log masuk."],["Delete the files, revoke and regenerate the keys, and audit access logs.","Padam fail, batalkan dan jana semula kunci, dan audit log akses."]],
["dbpw","Leaks","Critical","A02",'site:{d} (intext:"DB_PASSWORD" OR intext:"db_password" OR intext:"mysql_connect")',["Indexed pages that print database credentials or connection code.","Halaman diindeks yang memaparkan kelayakan pangkalan data atau kod sambungan."],["Remove the content, rotate the credentials, and request cache removal from the search engine.","Buang kandungan, tukar kelayakan, dan mohon pembuangan cache dari enjin carian."]],
["csv","Files","High","A01",'site:{d} (ext:csv OR ext:xls OR ext:xlsx) (email OR username OR password)',["Spreadsheets with user lists or credentials exposed publicly.","Hamparan dengan senarai pengguna atau kelayakan terdedah secara awam."],["Remove or protect the files, check for personal data (PDPA 2010), and notify affected users if needed.","Buang atau lindungi fail, semak data peribadi (PDPA 2010), dan maklumkan pengguna terjejas jika perlu."]],
["pma","Access","High","A05",'site:{d} (inurl:phpmyadmin OR inurl:adminer OR inurl:pma)',["Public database admin tools are a direct path to your data.","Alat admin pangkalan data awam ialah laluan terus ke data anda."],["Restrict by IP or VPN, remove if unused, and use strong unique credentials with MFA where possible.","Hadkan mengikut IP atau VPN, buang jika tidak digunakan, dan guna kelayakan kukuh serta MFA jika boleh."]],
["api","Exposure","Medium","A05",'site:{d} (inurl:swagger OR inurl:api-docs OR inurl:graphql)',["Public API documentation or GraphQL endpoints reveal your internal API surface.","Dokumentasi API awam atau endpoint GraphQL mendedahkan permukaan API dalaman anda."],["Require authentication for docs, disable introspection in production.","Wajibkan pengesahan untuk dokumentasi, matikan introspection dalam produksi."]]
];
var RW={Critical:4,High:3,Medium:2,Low:1,Info:0};
var $=function(i){return document.getElementById(i)};
var lang="ms",dom="",cat="all",state={},custom=[];
function cleanState(o){var r={};if(!o||typeof o!=="object")return r;Object.keys(o).slice(0,100).forEach(function(k){var v=o[k];if(/^[a-z0-9]{1,12}$/.test(k)&&v&&typeof v==="object"){r[k]={s:(v.s==="1"||v.s==="2")?v.s:"0",n:typeof v.n==="string"?v.n.slice(0,500):""}}});return r}
function save(){try{localStorage.setItem("df_state",JSON.stringify({dom:dom,state:state}))}catch(e){}}

function t(k){return T[lang][k]||k}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.getAttribute("data-i"))});
  if(!$("out").hidden)render();
}
function validDomain(s){return /^(?=.{4,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}$/.test(s)}
function cleanDomain(s){return s.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/[\/?#].*$/,"")}
function url(q){var e=$("eng").value,b=e==="b"?"https://www.bing.com/search?q=":e==="d"?"https://duckduckgo.com/?q=":"https://www.google.com/search?q=";return b+encodeURIComponent(q)}
function items(){
  var a=D.map(function(d){return{id:d[0],cat:d[1],risk:d[2],owasp:d[3],q:d[4],desc:d[5],fix:d[6]}});
  custom.forEach(function(c,i){a.push({id:"c"+i,cat:"Custom",risk:"Info",owasp:"-",q:c,desc:["Custom dork","Dork tersuai"],fix:["Review results and apply the matching fix.","Semak hasil dan laksanakan pembaikan yang sesuai."]})});
  return a;
}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function render(){
  var all=items(),L=lang==="ms"?1:0;
  var cats=["all"].concat(Array.from(new Set(all.map(function(x){return x.cat}))));
  var cw=$("cats");cw.textContent="";
  cats.forEach(function(c){var b=mk("button",null,c==="all"?t("all"):c);b.type="button";b.setAttribute("aria-pressed",String(c===cat));b.onclick=function(){cat=c;render()};cw.appendChild(b)});
  var lw=$("list");lw.textContent="";
  var checked=0,exposed=0,pts=0,max=0;
  all.forEach(function(x){
    var s=(state[x.id]||{}).s||"0";max+=RW[x.risk]+1;
    if(s!=="0")checked++;if(s==="2"){exposed++;pts+=RW[x.risk]+1}
    if(cat!=="all"&&x.cat!==cat)return;
    var q=x.q.split("{d}").join(dom);
    var c=mk("div","card"+(s!=="0"?" done":""));
    var h=mk("div");var tg=mk("span","tag "+x.risk,x.risk);h.appendChild(tg);
    h.appendChild(mk("span","mut","OWASP "+x.owasp+" - "+x.cat));c.appendChild(h);
    c.appendChild(mk("p",null,x.desc[L]));
    c.appendChild(mk("div","q",q));
    var bt=mk("div","btns");
    var cp=mk("button",null,t("copy"));cp.type="button";
    cp.onclick=function(){var done=function(){cp.textContent=t("copied");setTimeout(function(){cp.textContent=t("copy")},1200)};
      if(navigator.clipboard)navigator.clipboard.writeText(q).then(done,function(){});};
    var op=mk("button","p",t("open"));op.type="button";
    op.onclick=function(){window.open(url(q),"_blank","noopener,noreferrer")};
    bt.appendChild(cp);bt.appendChild(op);c.appendChild(bt);
    var dt=mk("details");dt.appendChild(mk("summary",null,t("why")));
    dt.appendChild(mk("p",null,t("fix")+": "+x.fix[L]));
    var sel=mk("select");sel.setAttribute("aria-label",t("status"));
    [["0","s0"],["1","s1"],["2","s2"]].forEach(function(o){var op2=mk("option",null,t(o[1]));op2.value=o[0];if(o[0]===s)op2.selected=true;sel.appendChild(op2)});
    sel.onchange=function(){(state[x.id]=state[x.id]||{}).s=sel.value;render()};
    var nt=mk("textarea");nt.rows=2;nt.placeholder=t("note");nt.value=(state[x.id]||{}).n||"";nt.maxLength=500;
    nt.oninput=function(){(state[x.id]=state[x.id]||{}).n=nt.value;save()};
    dt.appendChild(sel);dt.appendChild(nt);c.appendChild(dt);lw.appendChild(c);
  });
  var sc=max?Math.round(pts/max*100):0;
  var sm=$("sum");sm.textContent="";
  [[t("tot"),all.length],[t("chk"),checked],[t("exposed"),exposed],[t("score"),sc+"%"]].forEach(function(p){var d=mk("div");d.appendChild(mk("b",null,String(p[1])));d.appendChild(mk("span","mut",p[0]));sm.appendChild(d)});
  save();
}

function report(){
  var all=items(),L=lang==="ms"?1:0,sn=[t("s0"),t("s1"),t("s2")];
  var o=["# Exposure Self-Check Report","","- Domain: "+dom,"- Date: "+new Date().toISOString().slice(0,10),"- Tool: Dork Finder (FYP, Cybersecurity)","- "+t("score")+": "+$("sum").lastChild.firstChild.textContent,"","| Risk | OWASP | Check | Status | Notes |","|---|---|---|---|---|"];
  all.forEach(function(x){var st=state[x.id]||{};
    o.push("| "+x.risk+" | "+x.owasp+" | "+x.desc[L].replace(/\|/g,"/")+" | "+sn[+(st.s||0)]+" | "+(st.n||"").replace(/[|\r\n]+/g," ")+" |")});
  o.push("","## Remediation for exposed items","");
  var any=false;all.forEach(function(x){if((state[x.id]||{}).s==="2"){any=true;o.push("- ["+x.risk+"] "+x.desc[L]+" -> "+x.fix[L])}});
  if(!any)o.push("- None marked exposed.");
  o.push("","_Run only on domains you own or have written permission to test._");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o.join("\n")],{type:"text/markdown"}));
  a.download="dork-report-"+dom+".md";document.body.appendChild(a);a.click();a.remove();
}

$("go").onclick=function(){
  var d=cleanDomain($("dom").value);
  if(!validDomain(d)){$("err").textContent=t("eDom");return}
  if(!$("auth").checked){$("err").textContent=t("eAuth");return}
  $("err").textContent="";dom=d;$("out").hidden=false;render();$("out").scrollIntoView({behavior:"smooth"});
};
$("cadd").onclick=function(){
  var v=$("cq").value.trim();
  if(v.indexOf("{d}")<0||v.length>200){$("err").textContent=t("eC");return}
  $("err").textContent="";custom.push(v);$("cq").value="";
  try{localStorage.setItem("df_custom",JSON.stringify(custom))}catch(e){}
  render();
};
$("imp").onclick=function(){$("impf").click()};
$("impf").onchange=function(){var f=this.files[0];this.value="";if(!f)return;if(f.size>1e6){$("err").textContent=t("impe");return}var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j||!Array.isArray(j.results))throw 0;if(cleanDomain(String(j.domain||""))!==dom){$("err").textContent=t("impd");return}j.results.forEach(function(x){if(x&&/^[a-z0-9]{1,12}$/.test(x.id)&&(x.status==="1"||x.status==="2")){state[x.id]={s:x.status,n:String(x.note||"").slice(0,500)}}});$("err").textContent="";render()}catch(e){$("err").textContent=t("impe")}};r.readAsText(f)};
$("exp").onclick=report;
$("reset").onclick=function(){state={};render()};
$("lang").onclick=function(){lang=lang==="ms"?"en":"ms";applyLang()};
try{var s=JSON.parse(localStorage.getItem("df_custom")||"[]");if(Array.isArray(s))custom=s.filter(function(x){return typeof x==="string"&&x.length<=200}).slice(0,20)}catch(e){}
try{var P=JSON.parse(localStorage.getItem("df_state")||"{}");if(P&&validDomain(String(P.dom))){dom=P.dom;state=cleanState(P.state);$("dom").value=dom;$("auth").checked=true;$("out").hidden=false}}catch(e){}
applyLang();
})();
</script>
</body>
</html>
